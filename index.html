<script>

    document.addEventListener('DOMContentLoaded', () => {
      document.body.insertAdjacentHTML('beforeend', '<div class="err"><div style="font-size:30px;font-weight:800;font-style:italic">KAIDO NIGHTS</div><p>O jogo precisa ser aberto por um servidor local (o navegador bloqueia módulos e o arquivo GLB via file://).</p><p><b>Dê dois cliques em <span style="color:#ff2d55">INICIAR_JOGO.bat</span></b> na pasta do jogo.</p></div>');
    });
  }
  window.addEventListener('error', e => { console.error(e.error || e.message); });
</script>
<script type="module" src="src/main.js"></script>
