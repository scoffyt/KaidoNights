# Publica uma nova versao a cada push na branch main:
#  0. compila o aplicativo nativo KaidoNights.exe (janela propria com WebView2)
#  1. gera e assina o manifesto (segredo RELEASE_PRIVATE_KEY) -> branch "update-channel"
#     (os launchers instalados baixam os arquivos alterados direto deste repositorio)
#  2. gera os instaladores KaidoNights-Setup.exe / KaidoNights-Setup-Completo.exe
#  3. cria a Release "vX.Y.Z" no GitHub com os instaladores
name: Publicar versao

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar segredo de assinatura
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          if (-not $env:RELEASE_PRIVATE_KEY) {
            Write-Error "Crie o segredo RELEASE_PRIVATE_KEY (Settings > Secrets and variables > Actions) com o conteudo de keys/release-private.pem. Veja ATUALIZACOES.md."
            exit 1
          }

      - name: Testes
        shell: pwsh
        run: node --no-warnings --test tests/physics.test.js tests/track.test.js tests/release.test.js

      - name: Compilar o aplicativo nativo (KaidoNights.exe + WebView2)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-native.ps1

      - name: Publicar no canal de atualizacao (branch update-channel)
        id: channel
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
        run: |
          # The update-channel branch holds the complete installable tree (game files + native app),
          # one commit per version, never force-pushed: every published version stays downloadable.
          #   commit A = files   ->  manifest.fileBase = raw.githubusercontent.com/<repo>/<A>/
          #   commit B = A + manifest.json(.sig)   (what the launchers read)
          $ErrorActionPreference = 'Stop'
          $repoUrl = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          $ch = Join-Path $env:RUNNER_TEMP 'channel'
          git init -q $ch
          git -C $ch config core.autocrlf false
          git -C $ch config user.name "github-actions[bot]"
          git -C $ch config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C $ch remote add origin $repoUrl
          git -C $ch fetch -q --depth 1 origin update-channel 2>$null
          if ($LASTEXITCODE -eq 0) { git -C $ch checkout -q -B update-channel FETCH_HEAD } else { git -C $ch checkout -q --orphan update-channel }
          # replace the tree with this version's files
          Get-ChildItem $ch -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          node --no-warnings tools/release.mjs --channel github --native dist/native --native-in-tree --out channel-tmp --sha 0000000
          $m = Get-Content channel-tmp/manifest.json -Raw | ConvertFrom-Json
          foreach ($f in $m.files) {
            $src = if (Test-Path (Join-Path 'dist/native' $f.p)) { Join-Path 'dist/native' $f.p } else { $f.p }
            $dst = Join-Path $ch $f.p
            New-Item -ItemType Directory -Path (Split-Path -Parent $dst) -Force | Out-Null
            Copy-Item -LiteralPath $src -Destination $dst
          }
          Set-Content -Path (Join-Path $ch '.gitattributes') -Value '* -text' -Encoding ascii
          git -C $ch add -A
          git -C $ch commit -q -m "Arquivos da versao $($m.version) (${{ github.sha }})"
          $filesCommit = (git -C $ch rev-parse HEAD).Trim()
          # sign the manifest pointing at the files commit
          node --no-warnings tools/release.mjs --channel github --native dist/native --native-in-tree --out channel --sha $filesCommit --repo "${{ github.repository }}"
          Copy-Item channel/manifest.json, channel/manifest.json.sig -Destination $ch
          git -C $ch add manifest.json manifest.json.sig
          git -C $ch commit -q -m "Canal de atualizacao: v$($m.version)"
          git -C $ch push -q origin update-channel
          if ($LASTEXITCODE -ne 0) { throw 'push do canal falhou' }
          "version=$($m.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Gerar instaladores
        shell: pwsh
        env:
          RELEASE_PRIVATE_KEY: ${{ secrets.RELEASE_PRIVATE_KEY }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          $n = ("" + $env:COMMIT_MSG).Split("`n")[0]
          node --no-warnings tools/release.mjs --version ${{ steps.channel.outputs.version }} --native dist/native --notes "$n"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-setup.ps1

      - name: Criar Release no GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.channel.outputs.version }}"
          $notes = "Instale com **KaidoNights-Setup.exe** (baixa o jogo) ou **KaidoNights-Setup-Completo.exe** (offline). Quem ja tem o jogo instalado recebe esta versao automaticamente ao abrir.`n`nCommit: ${{ github.sha }}"
          gh release create "v$v" dist/KaidoNights-Setup.exe dist/KaidoNights-Setup-Completo.exe --title "Kaido Nights $v" --notes $notes --latest
